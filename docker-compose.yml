cat > ~/ghost_worker/docker-compose.yml << 'EOF'
services:
  ghost-dashboard:
    image: ghcr.io/anurag-dev999/ghost-worker-dashboard:latest
    container_name: ghost-dashboard
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./agency.db:/app/agency.db
      - ./templates:/app/templates
      - ./built_sites:/app/built_sites
      - ./logs:/app/logs
      - ./config.json:/app/config.json
      - ./raw_leads.json:/app/raw_leads.json
      - ./google_credentials.json:/app/google_credentials.json
    restart: always
    networks:
      - ghost-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ghost-scheduler:
    image: ghcr.io/anurag-dev999/ghost-worker-scheduler:latest
    container_name: ghost-scheduler
    command: python3 scheduler.py
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./agency.db:/app/agency.db
      - ./templates:/app/templates
      - ./built_sites:/app/built_sites
      - ./logs:/app/logs
      - ./config.json:/app/config.json
      - ./raw_leads.json:/app/raw_leads.json
      - ./google_credentials.json:/app/google_credentials.json
    restart: always
    healthcheck:
      disable: true
    networks:
      - ghost-network

networks:
  ghost-network:
    driver: bridge
    name: ghost-network
EOF
