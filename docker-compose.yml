rm ~/ghost_worker/docker-compose.yml

cat > ~/ghost_worker/docker-compose.yml << 'ENDOFFILE'
services:
  ghost-dashboard:
    image: ghcr.io/anurag-dev999/ghost-worker-dashboard:latest
    container_name: ghost-dashboard
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./agency.db:/app/agency.db
      - ./templates:/app/templates
      - ./built_sites:/app/built_sites
      - ./logs:/app/logs
      - ./config.json:/app/config.json
      - ./raw_leads.json:/app/raw_leads.json
      - ./google_credentials.json:/app/google_credentials.json
    restart: always
    networks:
      - ghost-network
  ghost-scheduler:
    image: ghcr.io/anurag-dev999/ghost-worker-scheduler:latest
    container_name: ghost-scheduler
    command: python3 scheduler.py
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./agency.db:/app/agency.db
      - ./templates:/app/templates
      - ./built_sites:/app/built_sites
      - ./logs:/app/logs
      - ./config.json:/app/config.json
      - ./raw_leads.json:/app/raw_leads.json
      - ./google_credentials.json:/app/google_credentials.json
    restart: always
    networks:
      - ghost-network
networks:
  ghost-network:
    driver: bridge
    name: ghost-network
ENDOFFILE

# Verify
cat ~/ghost_worker/docker-compose.yml
